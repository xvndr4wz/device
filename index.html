<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Info Perangkat</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; line-height: 1.6; }
        .container { max-width: 500px; margin: auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        h2 { border-bottom: 2px solid #38bdf8; padding-bottom: 10px; color: #38bdf8; }
        .info-item { background: #334155; margin: 10px 0; padding: 10px; border-radius: 6px; font-size: 14px; }
        .label { font-weight: bold; color: #94a3b8; display: block; font-size: 12px; }
        .status { text-align: center; padding: 10px; margin-top: 15px; border-radius: 6px; font-weight: bold; }
        .success { background: #065f46; color: #34d399; }
        .error { background: #7f1d1d; color: #f87171; }
        .warning { font-size: 11px; color: #facc15; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>Informasi Perangkat</h2>
    <div id="display">Menganalisis...</div>
    <div id="status-box"></div>
    <p class="warning">*IMEI tidak dapat diakses browser demi keamanan privasi global.</p>
</div>

<script>
    const webhookURL = "https://discord.com/api/webhooks/1452653310443257970/SkdnTLTdZUq5hJUf7POXHYcILxlYIVTS7TVc-NYKruBSlotTJtA2BzHY9bEACJxrlnd5";

    async function init() {
        const statusBox = document.getElementById('status-box');
        const display = document.getElementById('display');

        // Ambil data baterai
        let bat = "Tidak didukung";
        try {
            const b = await navigator.getBattery();
            bat = `${(b.level * 100).toFixed(0)}% (${b.charging ? 'Mengisi Daya' : 'Tidak Dicash'})`;
        } catch(e) {}

        const deviceData = {
            os: navigator.platform,
            browser: navigator.userAgent,
            screen: `${screen.width}x${screen.height}`,
            lang: navigator.language,
            time: new Date().toLocaleString('id-ID'),
            battery: bat
        };

        // Tampilkan di layar website
        display.innerHTML = `
            <div class="info-item"><span class="label">MODEL / BROWSER</span>${deviceData.browser}</div>
            <div class="info-item"><span class="label">SISTEM OPERASI</span>${deviceData.os}</div>
            <div class="info-item"><span class="label">RESOLUSI LAYAR</span>${deviceData.screen}</div>
            <div class="info-item"><span class="label">STATUS BATERAI</span>${deviceData.battery}</div>
            <div class="info-item"><span class="label">WAKTU AKSES</span>${deviceData.time}</div>
        `;

        // Kirim ke Webhook
        const payload = {
            username: "Device Logger Bot",
            embeds: [{
                title: "📱 Data Perangkat Masuk",
                color: 5763719,
                fields: [
                    { name: "User Agent", value: deviceData.browser },
                    { name: "OS/Platform", value: deviceData.os, inline: true },
                    { name: "Baterai", value: deviceData.battery, inline: true },
                    { name: "Layar", value: deviceData.screen, inline: true }
                ],
                timestamp: new Date()
            }]
        };

        try {
            const response = await fetch(webhookURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                statusBox.className = "status success";
                statusBox.innerText = "✓ Data Terkirim ke Webhook";
            } else {
                throw new Error();
            }
        } catch (err) {
            statusBox.className = "status error";
            statusBox.innerText = "✗ Gagal Mengirim ke Webhook";
        }
    }

    window.onload = init;
</script>

</body>
</html>
